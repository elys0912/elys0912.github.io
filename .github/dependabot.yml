version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 実行環境の Node 24 に型定義をそろえる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript のメジャーは portfolio と合わせて上げる（shared/ の型の検査を両方で通すため）
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

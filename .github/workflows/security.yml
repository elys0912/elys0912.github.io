name: Security

on:
  pull_request:
  # main への直接の push でも、次の定期実行（最大 1 週間後）を待たずに検出する。
  # 公開リポジトリへの露出そのものは止められない。止めるのはリポジトリの secret scanning の push protection
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 09:00 JST

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # サードパーティのアクションはタグの付け替えで中身が変わらないよう、コミットの SHA で固定する（dependabot が更新する）
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

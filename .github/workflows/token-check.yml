name: Token check

# PORTFOLIO_REBUILD_TOKEN（portfolio の Rebuild site を起動する fine-grained PAT）が、まだ使えるかを週 1 回確かめる。
# このトークンは記事を公開したときしか使わないので、期限切れや secret の誤削除に、次の公開まで気づけない。
# 失敗したらジョブを失敗させ、Actions の通知で知る。期限が切れても、portfolio の週 1 回の定期のビルドで新着は追いつく。
# 期限の一覧と更新の手順は portfolio の notes に置く（値や期限の日付はこのリポジトリに書かない）
on:
  schedule:
    - cron: '0 0 * * 3' # 毎週水曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

env:
  PORTFOLIO_REPO: ${{ github.repository_owner }}/portfolio
  # 期限までこの日数を切ったら失敗させる（更新の猶予）
  EXPIRY_WARNING_DAYS: '14'

jobs:
  portfolio-rebuild-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # portfolio の Rebuild site のワークフローを読むだけ。fine-grained PAT は応答のヘッダー github-authentication-token-expiration に期限が入る
      - name: PORTFOLIO_REBUILD_TOKEN が使えるか
        env:
          PORTFOLIO_REBUILD_TOKEN: ${{ secrets.PORTFOLIO_REBUILD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PORTFOLIO_REBUILD_TOKEN" ]; then
            echo "::error::secrets.PORTFOLIO_REBUILD_TOKEN が未設定"
            exit 1
          fi
          headers=$(mktemp)
          status=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $PORTFOLIO_REBUILD_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$PORTFOLIO_REPO/actions/workflows/rebuild.yml")
          if [ "$status" != 200 ]; then
            echo "::error::PORTFOLIO_REBUILD_TOKEN で portfolio の Rebuild site を読めない（HTTP $status）。期限切れか権限の不足"
            exit 1
          fi
          expiry=$(grep -i '^github-authentication-token-expiration:' "$headers" | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -z "$expiry" ]; then
            echo "::notice::PORTFOLIO_REBUILD_TOKEN は使える（期限はヘッダーに無い）"
            exit 0
          fi
          days_left=$(( ( $(date -d "$expiry" +%s) - $(date +%s) ) / 86400 ))
          if [ "$days_left" -lt "$EXPIRY_WARNING_DAYS" ]; then
            echo "::error::PORTFOLIO_REBUILD_TOKEN の期限まで $days_left 日（$expiry）。再発行して secret を登録し直す"
            exit 1
          fi
          echo "::notice::PORTFOLIO_REBUILD_TOKEN は使える。期限まで $days_left 日"

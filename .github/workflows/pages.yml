name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ワークフロー全体には読み取りだけを渡す。pages: write と id-token: write は deploy のジョブだけに付ける
permissions:
  contents: read

# デプロイは同時に 1 つだけ。実行中のデプロイは止めず、後から来たものを待たせる（GitHub Pages の推奨の設定）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # main への push で CI（ci.yml）の結果を待たずに動く。公開しない記事（draft、未来の日付）があればビルドが失敗する
      # 記事ごとの OGP 画像は、ビルドがヘッドレスの Chrome で作る（src/og.ts）。ランナーには日本語の書体が無いので入れる。
      # 入っていないままビルドすると文字の無い画像になるので、書体が見つからなければ止める
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=ja | grep -q .
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages の設定（公開元が GitHub Actions になっていること）を確かめる。Pages の API を読むので、権限のあるこのジョブで動かす
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  # 公開が成功した後に、portfolio の Rebuild site を起動する。トップページの「ブログの新着」を、公開したフィードで作り直すため（portfolio の ADR 0022）。
  # needs: deploy なので、公開が終わる前には起動しない（古いフィードでビルドされるのを避ける）。
  # トークンは portfolio の Actions の書き込みだけを持つ fine-grained PAT。ジョブにはリポジトリの権限を渡さない。
  # secret が未設定なら起動せず成功で終える。新着は portfolio の週 1 回の定期のビルドで追いつく
  rebuild-portfolio:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PORTFOLIO_REPO: ${{ github.repository_owner }}/portfolio
    steps:
      - name: portfolio の Rebuild site を起動する
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_REBUILD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::secrets.PORTFOLIO_REBUILD_TOKEN が未設定。Rebuild site は起動しない"
            exit 0
          fi
          gh workflow run rebuild.yml --repo "$PORTFOLIO_REPO" --ref main
